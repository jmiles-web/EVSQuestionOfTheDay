<!DOCTYPE html>
<html>
<head>
    <title>Question of the Day</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            max-width:900px;
            margin:auto;
            padding:30px;
        }

        h1{
            color:#003366;
        }

        .answer{
            background:#f2f2f2;
            padding:15px;
            margin:10px 0;
            border-radius:5px;
            font-size:18px;
        }

        .form-link{
            margin-top:40px;
            text-align:center;
        }

        .form-link a{
            font-size:20px;
            font-weight:bold;
        }

    </style>
</head>

<body>

<h1>Question of the Day</h1>

<h2 id="question">Loading...</h2>

<div class="answer" id="a"></div>
<div class="answer" id="b"></div>
<div class="answer" id="c"></div>
<div class="answer" id="d"></div>

<div class="form-link">
    <a href="https://forms.office.com/r/zhy19AjQXB
       Submit Your Answer
    </a>
</div>

<script>

fetch('questions.json')
  .then(response => response.json())
  .then(data => {

    const today = new Date()
      .toISOString()
      .split('T')[0];

    const todaysQuestion =
      data.find(q => q.date === today);

    if (todaysQuestion) {

      document.getElementById('question').innerText =
        todaysQuestion.question;

      document.getElementById('a').innerText =
        'A. ' + todaysQuestion.answerA;

      document.getElementById('b').innerText =
        'B. ' + todaysQuestion.answerB;

      document.getElementById('c').innerText =
        'C. ' + todaysQuestion.answerC;

      document.getElementById('d').innerText =
        'D. ' + todaysQuestion.answerD;

    }
    else {

      document.getElementById('question').innerText =
        'No question scheduled today.';

    }

  })
  .catch(error => {

    document.getElementById('question').innerText =
      'Unable to load questions.';

    console.error(error);

  });

</script>

</body>
</html>
