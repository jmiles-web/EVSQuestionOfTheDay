<!DOCTYPE html>
<html>
<head>
    <title>Question of the Day</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            max-width:900px;
            margin:auto;
            padding:30px;
        }

        h1{
            color:#003366;
        }

        .answer{
            background:#f2f2f2;
            padding:15px;
            margin:10px 0;
            border-radius:5px;
            font-size:18px;
        }

        .form-link{
            margin-top:40px;
            text-align:center;
        }

        .form-link a{
            font-size:20px;
            font-weight:bold;
        }

    </style>
</head>

<body>

<h1>Question of the Day</h1>

<h2 id="question">Loading...</h2>

<div class="answer" id="a"></div>
<div class="answer" id="b"></div>
<div class="answer" id="c"></div>
<div class="answer" id="d"></div>

<div class="form-link">
    <a href="PASTE_YOUR_MICRO_LINK_HERE
       Submit Your Answer
    </a>
</div>

<script>

fetch('questions.csv')
.then(response => response.text())
.then(data => {

    const today = new Date().toISOString().split('T')[0];

    const rows = data.split('\n');

    for(let i = 1; i < rows.length; i++){

        const cols = rows[i].split(',');

        if(cols[0] === today){

            document.getElementById('question').innerText = cols[1];
            document.getElementById('a').innerText = 'A. ' + cols[2];
            document.getElementById('b').innerText = 'B. ' + cols[3];
            document.getElementById('c').innerText = 'C. ' + cols[4];
            document.getElementById('d').innerText = 'D. ' + cols[5];

            return;
        }
    }

    document.getElementById('question').innerText =
      'No question scheduled today.';
});
</script>

</body>
</html>
