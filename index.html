<!DOCTYPE html>
<html>
<head>
    <title>Question of the Day</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            max-width:900px;
            margin:auto;
            padding:30px;
        }

        h1{
            color:#003366;
        }

        .answer{
            background:#f2f2f2;
            padding:15px;
            margin:10px 0;
            border-radius:5px;
            font-size:18px;
        }

        .form-link{
            margin-top:40px;
            text-align:center;
        }

        .form-link a{
            font-size:20px;
            font-weight:bold;
        }

    </style>
</head>

<body>

<h1>Question of the Day</h1>

<h2 id="question">Loading...</h2>

<div class="answer" id="a"></div>
<div class="answer" id="b"></div>
<div class="answer" id="c"></div>
<div class="answer" id="d"></div>

<div class="form-link">
        <iframe width="840px" height="1200px" src="https://forms.office.com/r/zhy19AjQXB?embed=true" frameborder="0" marginwidth="0" marginheight="0" style="border: none; max-width:100%; max-height:100vh" allowfullscreen webkitallowfullscreen mozallowfullscreen msallowfullscreen> </iframe>
</div>

<script>
    
fetch('questions.json')
  .then(response => response.json())
  .then(data => {

    const today = new Date()
      .toISOString()
      .split('T')[0];

    const todaysQuestion =
      data.find(q => q["Date"] === today);

    if (todaysQuestion) {

      document.getElementById('question').innerText =
        todaysQuestion["Question"];

      document.getElementById('a').innerText =
        'A. ' + todaysQuestion["Answer A"];

      document.getElementById('b').innerText =
        'B. ' + todaysQuestion["Answer B"];

      document.getElementById('c').innerText =
        'C. ' + todaysQuestion["Answer C"];

      document.getElementById('d').innerText =
        'D. ' + todaysQuestion["Answer D"];

    } else {

      document.getElementById('question').innerText =
        'No question scheduled today.';

    }
  })
  .catch(error => {

    document.getElementById('question').innerText =
      'Unable to load questions.';

    console.error(error);

  });

</script>

</body>
</html>
